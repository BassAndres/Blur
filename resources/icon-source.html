<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}</style></head>
<body>
<svg id="ic" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19e6ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- speed streaks -->
  <g filter="url(#glow)" opacity="0.9">
    <rect x="120" y="430" width="520" height="22" rx="11" fill="#19e6ff"/>
    <rect x="170" y="500" width="640" height="22" rx="11" fill="#ff2bd6"/>
    <rect x="120" y="570" width="430" height="22" rx="11" fill="#39ff88"/>
  </g>
  <!-- stylized racer arrow -->
  <g filter="url(#glow)">
    <path d="M300 320 L760 512 L300 704 L300 600 L560 512 L300 424 Z" fill="url(#neon)"/>
  </g>
  <!-- bolt accent -->
  <g filter="url(#glow)">
    <path d="M700 250 L640 430 L710 430 L630 700 L800 420 L720 420 L780 250 Z" fill="#ffe14d" opacity="0.95"/>
  </g>
</svg>
</body></html>
